name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

env:
  DEPLOY_DIR: /home/ubuntu/TravelWithUs

jobs:
  deploy:
    name: Deploy to EC2 Instance
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment Commands on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          envs: GITHUB_TOKEN,DEPLOY_DIR
          script: |
            echo "=========================================================="
            echo " Starting Deployment on AWS EC2"
            echo " Target Directory: $DEPLOY_DIR"
            echo "=========================================================="

            # 1. Ensure deployment directory exists
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Directory does not exist. Creating and cloning repository..."
              sudo mkdir -p "$DEPLOY_DIR"
              sudo chown -R $USER:$USER "$DEPLOY_DIR"
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            # 2. Configure auth and fetch the latest code from main
            echo "Fetching latest changes..."
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main

            # 3. Stop old containers and spin up new containers using Docker Compose
            echo "Stopping old containers..."
            docker compose down --remove-orphans || true

            echo "Building and starting services..."
            docker compose up -d --build

            # 4. Clean up unused images and build cache to save disk space on EC2
            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "=========================================================="
            echo " Deployment completed successfully!"
            echo " Container status:"
            echo "=========================================================="
            docker compose ps
