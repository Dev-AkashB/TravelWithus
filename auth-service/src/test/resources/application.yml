server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:auth_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  jwt:
    secret: TestSecretKeyMustBeLongEnoughForHmacSha256AlgorithmEnterpriseGrade12345
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
    issuer: test-auth
