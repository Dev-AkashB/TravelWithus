server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Public & Auth Routes
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        # User Service Routes
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**

        # Destination Service Routes
        - id: destination-service
          uri: lb://destination-service
          predicates:
            - Path=/api/v1/destinations/**

        # Package Service Routes
        - id: package-service
          uri: lb://package-service
          predicates:
            - Path=/api/v1/packages/**

        # Hotel Service Routes
        - id: hotel-service
          uri: lb://hotel-service
          predicates:
            - Path=/api/v1/hotels/**

        # Booking Service Routes
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/v1/bookings/**

        # Payment Service Routes
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**

        # Notification Service Routes
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        # Review Service Routes
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/v1/reviews/**

        # Admin Service Routes (Guarded for ROLE_ADMIN / ROLE_SUPER_ADMIN)
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/**

        # WebSocket real-time updates
        - id: notification-websocket
          uri: lb:ws://notification-service
          predicates:
            - Path=/ws/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:5173"
              - "http://localhost:5174"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

app:
  jwt:
    secret: ${JWT_SECRET:TravelWithUsSuperSecretJwtKeyMustBe256BitsOrLongerForHMACSHA256EnterpriseSecurity!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.travelwithus.gateway: DEBUG
